services:
  site:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Serves at the domain root; set to a subpath (e.g. /open-tabular-insight-extraction)
        # if this is hosted behind a path prefix instead. See astro.config.mjs.
        SITE_BASE: /
    ports:
      - "1611:80"
    restart: unless-stopped
