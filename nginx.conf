server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Astro's `trailingSlash: 'ignore'` build emits directory-style routes
    # (e.g. full-paper/introduction/index.html) — try the exact path, then as
    # a directory index, falling back to the site's own 404 page.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    location ~* \.(?:css|js|woff2?|svg|png|jpe?g|webp|avif|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
